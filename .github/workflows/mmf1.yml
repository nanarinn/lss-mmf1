name: MMF MQTT to PythonAnywhere and Supabase

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: mmf1-mqtt-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
      LSS_INGEST_TOKEN: ${{ secrets.MMF_INGEST_TOKEN }}
      LSS_PUSH_URL: https://adrianna217.pythonanywhere.com/api/lss/mmf/ingest
      LSS_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      LSS_SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - name: Read repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check secrets
        run: |
          python - <<'PY'
          import os

          required = {
              "MQTT_PASSWORD": "MQTT_PASSWORD",
              "LSS_INGEST_TOKEN": "MMF_INGEST_TOKEN",
              "LSS_SUPABASE_URL": "SUPABASE_URL",
              "LSS_SUPABASE_SECRET_KEY": "SUPABASE_SECRET_KEY",
          }

          missing = [
              secret
              for variable, secret in required.items()
              if not os.environ.get(variable, "").strip()
          ]

          if missing:
              raise SystemExit(
                  "Missing GitHub Secrets: " + ", ".join(missing)
              )

          print("All required secrets are configured")
          PY

      - name: Install MQTT dependency
        run: python -m pip install paho-mqtt==2.1.0

      - name: Capture MQTT and upload readings
        run: python collector.py --capture-seconds 60
