name: MMF1 MQTT to PythonAnywhere

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: mmf1-mqtt-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
      LSS_INGEST_TOKEN: ${{ secrets.MMF_INGEST_TOKEN }}
      LSS_PUSH_URL: https://adrianna217.pythonanywhere.com/api/lss/mmf/ingest

    steps:
      - name: Read repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check secrets
        run: |
          python -c "import os; assert os.environ.get('MQTT_PASSWORD'), 'MQTT_PASSWORD secret is missing'; assert os.environ.get('LSS_INGEST_TOKEN'), 'MMF_INGEST_TOKEN secret is missing'"

      - name: Install MQTT dependency
        run: python -m pip install paho-mqtt==2.1.0

      - name: Capture MMF1 and upload snapshot
        run: python collector.py --capture-seconds 60
